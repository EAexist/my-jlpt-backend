openapi: "3.1.0"
info:
  title: my-jlpt API
  version: "1.0.0"
  description: |
    Backend API for my-jlpt.
    Japanese text input → Asynchronous AI-powered JLPT learning content generator.

    ## Auth
    All protected endpoints require: `Authorization: Bearer <jwt>`
    The frontend manages OAuth via Auth.js and synchronizes sessions via `/auth/sync`.

    ## Errors
    All error responses follow the shape: `{ "detail": "string" }`

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.my-jlpt.com
    description: Production

tags:
  - name: health
    description: Service health check
  - name: auth
    description: User identity synchronization and session profiles
  - name: content
    description: JLPT analysis content orchestration and ingestion

paths:

  # --- Health ---------------------------------------------------------------

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # --- Auth -----------------------------------------------------------------

  /auth/sync:
    post:
      operationId: syncUserSession
      tags: [auth]
      summary: Idempotent session upsert triggered by frontend OAuth callback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerAccountId, email, display_name]
              properties:
                provider:
                  type: string
                  example: google
                providerAccountId:
                  type: string
                  example: "1234567890"
                email:
                  type: string
                  format: email
                  nullable: true
                display_name:
                  type: string
                  example: "Hong Gil Dong"
                avatar_url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        "200":
          description: Identity synchronized successfully. Returns session details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid payload configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user records matching the verified session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Content --------------------------------------------------------------

  /content:
    post:
      operationId: createContent
      tags: [content]
      summary: Ingest text payload and dispatch an asynchronous Cloud Task processor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "202":
          description: Ingestion job accepted. Client should poll the returned job status.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Input constraints violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listContent
      tags: [content]
      summary: List all content entities owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of lightweight content metadata elements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Poll status milestones or retrieve full study content payloads
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Combined job execution status wrapper and processed content details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteContent
      tags: [content]
      summary: Purge saved study content records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Target resource successfully purged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    User:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true

    JLPTLevel:
      type: string
      enum: [N1, N2, N3, N4, N5]

    LevelDistribution:
      type: object
      required: [N1, N2, N3, N4, N5]
      properties:
        N1: { type: integer }
        N2: { type: integer }
        N3: { type: integer }
        N4: { type: integer }
        N5: { type: integer }

    Sentence:
      type: object
      required: [text, translation, level, grammar_points, similar_patterns]
      properties:
        text:
          type: string
        translation:
          type: string
        level:
          $ref: "#/components/schemas/JLPTLevel"
        grammar_points:
          type: array
          items: { type: string }
        similar_patterns:
          type: array
          items: { type: string }

    VocabularyItem:
      type: object
      required: [word, reading, level, translation, synonyms, example_phrases]
      properties:
        word:
          type: string
        reading:
          type: string
        level:
          $ref: "#/components/schemas/JLPTLevel"
        translation:
          type: string
        synonyms:
          type: array
          items: { type: string }
        example_phrases:
          type: array
          items: { type: string }

    ContentSummary:
      type: object
      required: [id, title, input_text, created_at, overall_level, level_distribution]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        input_text:
          type: string
        created_at:
          type: string
          format: date-time
        overall_level:
          $ref: "#/components/schemas/JLPTLevel"
        level_distribution:
          $ref: "#/components/schemas/LevelDistribution"

    ContentFull:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          required: [sentences, vocabulary]
          properties:
            sentences:
              type: array
              items:
                $ref: "#/components/schemas/Sentence"
            vocabulary:
              type: array
              items:
                $ref: "#/components/schemas/VocabularyItem"

    JobStatusResponse:
      type: object
      required: [job_id, status, progress]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: integer
          description: Execution completeness tracking (16, 33, 66, 83, 100)
          example: 33
        error:
          type: string
          nullable: true
          description: populated when status resolves to 'failed'
        data:
          $ref: "#/components/schemas/ContentFull"
          nullable: true
          description: populated only when status resolves to 'completed'

    CreateContentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        title:
          type: string
          nullable: true

  responses:
    Unauthorized:
      description: Session missing or invalid verification token signature
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "Not authenticated"

    Forbidden:
      description: Resource request signature violates data isolation boundary controls
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "Access forbidden"

    NotFound:
      description: Target asset key sequence not matching persistent indexes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "Not found"